server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/ipintelligence_db
spring.datasource.username=postgres
spring.datasource.password=Chakri1124

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

jwt.secret=change_this_to_32_characters_minimum_secret_key
jwt.expiration=86400000

# === OAuth2 client: Google ===
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-name=Google

# Frontend redirect after OAuth success
app.oauth2.authorized-redirect-uri=http://localhost:3000/oauth2/success

app.api.uspto.base-url=https://developer.uspto.gov/ds-api
app.api.uspto.api-key=

app.api.epo.base-url=https://ops.epo.org/3.2
app.api.epo.consumer-key=
app.api.epo.consumer-secret=

app.api.wipo.base-url=https://www.wipo.int/branddb/v2
app.api.wipo.api-key=

app.api.tmview.base-url=https://www.tmdn.org/tmview
